<html lang="ko">

<meta charset="UTF-8">

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --primary: #2e7d32;
    --primary-light: #4caf50;
    --primary-dark: #1b5e20;
    --success: #2e7d32;
    --warning: #f59e0b;
    --danger: #dc2626;
    --bg: #f5f7f5;
    --card: #ffffff;
    --text: #1e293b;
    --text-light: #64748b;
    --border: #e2e8e2;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif; background:var(--bg); color:var(--text); }

  .header {
    background: linear-gradient(135deg, #1b5e20 0%, #388e3c 100%);
    color:#fff; padding:24px 32px; display:flex; justify-content:space-between; align-items:center;
  }
  .header h1 { font-size:22px; font-weight:700; }
  .header .date { font-size:13px; opacity:.8; }

  .filters {
    background:#fff; padding:14px 32px; border-bottom:1px solid var(--border);
    display:flex; gap:12px; align-items:center; flex-wrap:wrap;
  }
  .filters label { font-size:13px; font-weight:600; color:var(--text-light); }
  .filters select, .filters input {
    padding:6px 12px; border:1px solid var(--border); border-radius:6px;
    font-size:13px; background:#fff; outline:none;
  }
  .filters select:focus { border-color:var(--primary); }
  .filter-group { display:flex; align-items:center; gap:6px; }

  .container { max-width:1440px; margin:0 auto; padding:20px 24px; }

  /* KPI Cards */
  .kpi-row { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:16px; margin-bottom:24px; }
  .kpi-card {
    background:var(--card); border-radius:12px; padding:20px;
    box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  .kpi-card .label { font-size:12px; color:var(--text-light); font-weight:600; margin-bottom:4px; text-transform:uppercase; letter-spacing:.5px; }
  .kpi-card .value { font-size:26px; font-weight:800; }
  .kpi-card .sub { font-size:12px; color:var(--text-light); margin-top:4px; }
  .kpi-card .rate { font-size:15px; font-weight:700; margin-top:2px; }
  .rate.good { color:var(--success); }
  .rate.warn { color:var(--warning); }
  .rate.bad { color:var(--danger); }

  /* Chart area */
  .chart-row { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:24px; }
  .chart-card {
    background:var(--card); border-radius:12px; padding:20px;
    box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  .chart-card h3 { font-size:14px; font-weight:700; margin-bottom:14px; color:var(--text); }
  .chart-card canvas { width:100%!important; }

  /* Table */
  .table-card {
    background:var(--card); border-radius:12px; padding:20px;
    box-shadow:0 1px 3px rgba(0,0,0,.06); margin-bottom:24px; overflow-x:auto;
  }
  .table-card h3 { font-size:14px; font-weight:700; margin-bottom:14px; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th { background:#f8fafc; padding:10px 10px; text-align:right; font-weight:600; color:var(--text-light); border-bottom:2px solid var(--border); white-space:nowrap; }
  th:nth-child(-n+4) { text-align:left; }
  td { padding:8px 10px; border-bottom:1px solid var(--border); text-align:right; white-space:nowrap; }
  td:nth-child(-n+4) { text-align:left; }
  tr:hover td { background:#f8fafc; }
  .progress-cell { min-width:140px; }
  .progress-bar-bg { background:#e2e8f0; border-radius:6px; height:20px; position:relative; overflow:hidden; }
  .progress-bar-fill { height:100%; border-radius:6px; transition:width .3s; display:flex; align-items:center; justify-content:flex-end; padding-right:6px; }
  .progress-bar-fill span { font-size:11px; font-weight:700; color:#fff; text-shadow:0 0 2px rgba(0,0,0,.3); }
  .fill-good { background: linear-gradient(90deg, #22c55e, #16a34a); }
  .fill-warn { background: linear-gradient(90deg, #fbbf24, #f59e0b); }
  .fill-bad { background: linear-gradient(90deg, #f87171, #dc2626); }
  .fill-over { background: linear-gradient(90deg, #2e7d32, #1b5e20); }

  .badge {
    display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:600;
  }
  .badge-online { background:#e8f5e9; color:#2e7d32; }
  .badge-offline { background:#fff3e0; color:#e65100; }
  .badge-export { background:#e3f2fd; color:#1565c0; }

  .tab-row { display:flex; gap:4px; margin-bottom:16px; }
  .tab-btn {
    padding:8px 18px; border:none; border-radius:8px 8px 0 0;
    font-size:13px; font-weight:600; cursor:pointer;
    background:#e2e8f0; color:var(--text-light); transition:all .2s;
  }
  .tab-btn.active { background:var(--primary); color:#fff; }

  .manager-section { margin-bottom:20px; }
  .manager-header {
    padding:10px 16px; background:#e8f5e9; border-radius:8px;
    font-weight:700; font-size:14px; margin-bottom:8px;
    display:flex; justify-content:space-between; align-items:center;
  }

  .yoy-up { color:#2e7d32; font-weight:700; }
  .yoy-down { color:#dc2626; font-weight:700; }
  .yoy-na { color:#94a3b8; }

  @media (max-width:900px) {
    .chart-row { grid-template-columns:1fr; }
    .kpi-row { grid-template-columns:repeat(2,1fr); }
  }
  @media (max-width:600px) {
    .kpi-row { grid-template-columns:1fr; }
    .header { padding:16px; }
    .container { padding:12px; }
  }

  /* Login Overlay */
  .login-overlay {
    position:fixed; top:0; left:0; width:100%; height:100%;
    background:linear-gradient(135deg, #1b5e20 0%, #388e3c 50%, #2e7d32 100%);
    display:flex; align-items:center; justify-content:center;
    z-index:9999;
  }
  .login-box {
    background:#fff; border-radius:16px; padding:48px 40px; width:360px;
    box-shadow:0 20px 60px rgba(0,0,0,.3); text-align:center;
  }
  .login-box h2 { font-size:22px; font-weight:800; color:#1b5e20; margin-bottom:6px; }
  .login-box .login-sub { font-size:13px; color:var(--text-light); margin-bottom:28px; }
  .login-box input {
    width:100%; padding:12px 16px; border:2px solid var(--border); border-radius:10px;
    font-size:15px; text-align:center; outline:none; letter-spacing:4px;
    transition:border-color .2s;
  }
  .login-box input:focus { border-color:var(--primary); }
  .login-box button {
    width:100%; margin-top:14px; padding:12px; border:none; border-radius:10px;
    background:linear-gradient(135deg, #2e7d32, #388e3c); color:#fff;
    font-size:15px; font-weight:700; cursor:pointer; transition:opacity .2s;
  }
  .login-box button:hover { opacity:.9; }
  .login-error { color:#dc2626; font-size:13px; margin-top:10px; min-height:20px; }
  .login-logo { font-size:40px; margin-bottom:12px; }

  .dashboard-content { display:none; }
</style>
</head>

// ===== AUTH =====
const PW_HASH = '4f50483eae271d6cf0d2a4b6b55e7f8387160bedffbf86725176760fdb29ca86';

async function sha256(msg) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(msg));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
}

async function tryLogin() {
  const pw = document.getElementById('loginPw').value;
  if (!pw) return;
  const hash = await sha256(pw);
  if (hash === PW_HASH) {
    sessionStorage.setItem('cle_dash_auth', '1');
    showDashboard();
  } else {
    document.getElementById('loginError').textContent = '비밀번호가 올바르지 않습니다';
    document.getElementById('loginPw').value = '';
    document.getElementById('loginPw').focus();
  }
}

function showDashboard() {
  document.getElementById('loginOverlay').style.display = 'none';
  document.getElementById('dashboardContent').style.display = 'block';
}

if (sessionStorage.getItem('cle_dash_auth') === '1') {
  showDashboard();
}

document.getElementById('loginBtn').addEventListener('click', tryLogin);
document.getElementById('loginPw').addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });

const MONTHS = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
const ACTUAL_MONTHS = 8;

// ===== UTILITIES =====
function fmt(v) {
  if (Math.abs(v) >= 1e8) return (v/1e8).toFixed(1) + '억';
  if (Math.abs(v) >= 1e4) return (v/1e4).toFixed(0) + '만';
  return v.toLocaleString();
}
function fmtFull(v) { return Math.round(v).toLocaleString(); }
function pct(v) { return (v*100).toFixed(1) + '%'; }
function rateClass(r) { return r >= 1 ? 'good' : r >= 0.9 ? 'warn' : 'bad'; }
function fillClass(r) { return r >= 1 ? 'fill-over' : r >= 0.9 ? 'fill-good' : r >= 0.7 ? 'fill-warn' : 'fill-bad'; }

function getPrevKey(item) {
  return item.group + '_' + item.channel;
}

function getPrevMonths(item) {
  return PREV_YEAR[getPrevKey(item)] || null;
}

function getPlanForPeriod(d, monthFilter) {
  if (monthFilter === 'ytd') {
    let v = 0;
    for (let i = 0; i < ACTUAL_MONTHS; i++) v += d.months[i];
    return v;
  }
  return d.months[parseInt(monthFilter)];
}
function getActualForPeriod(d, monthFilter) {
  return getPlanForPeriod(d, monthFilter);
}

function getPrevForPeriod(months, monthFilter) {
  if (!months) return null;
  if (monthFilter === 'ytd') {
    let v = 0;
    for (let i = 0; i < ACTUAL_MONTHS; i++) v += months[i];
    return v;
  }
  return months[parseInt(monthFilter)];
}

function findActual(planItem) {
  return ACTUAL.find(a => a.channel === planItem.channel && a.group === planItem.group);
}

function getFiltered() {
  const mgr = document.getElementById('filterManager').value;
  const type = document.getElementById('filterType').value;
  const month = document.getElementById('filterMonth').value;

  let planF = PLAN.filter(d => {
    if (mgr !== 'all' && d.manager !== mgr) return false;
    if (type !== 'all' && d.type !== type) return false;
    return true;
  });

  let actualF = ACTUAL.filter(d => {
    if (type !== 'all' && d.type !== type) return false;
    if (mgr !== 'all') {
      const inPlan = planF.find(p => p.channel === d.channel && p.group === d.group);
      if (!inPlan && d.manager !== mgr) return false;
    }
    return true;
  });

  return { plan: planF, actual: actualF, month };
}

function sumMonths(arr, monthFilter) {
  if (monthFilter === 'ytd') {
    return arr.reduce((s, d) => {
      let v = 0;
      for (let i = 0; i < ACTUAL_MONTHS; i++) v += d.months[i];
      return s + v;
    }, 0);
  }
  const m = parseInt(monthFilter);
  return arr.reduce((s, d) => s + d.months[m], 0);
}

// ===== RENDER =====
let chartMonthly, chartType, chartManager, chartGroup;

function renderKPI() {
  const { plan, actual, month } = getFiltered();
  const planTotal = sumMonths(plan, month);

  let actualTotal = 0;
  plan.forEach(p => {
    const a = findActual(p);
    if (a) actualTotal += getPlanForPeriod(a, month);
  });
  ACTUAL.filter(a => !PLAN.find(p => p.channel === a.channel && p.group === a.group)).forEach(a => {
    const mgr = document.getElementById('filterManager').value;
    const type = document.getElementById('filterType').value;
    if (mgr !== 'all' && a.manager !== mgr) return;
    if (type !== 'all' && a.type !== type) return;
    actualTotal += getPlanForPeriod(a, month);
  });

  const rate = planTotal > 0 ? actualTotal / planTotal : 0;
  const yearPlan = plan.reduce((s, d) => s + d.total, 0);
  const yearRate = yearPlan > 0 ? actualTotal / yearPlan : 0;
  const gap = actualTotal - planTotal;

  // YoY calculation
  let prevTotal = 0;
  let hasPrev = false;
  plan.forEach(p => {
    const pm = getPrevMonths(p);
    if (pm) {
      hasPrev = true;
      prevTotal += getPrevForPeriod(pm, month);
    }
  });
  const yoyRate = (hasPrev && prevTotal > 0) ? (actualTotal / prevTotal - 1) : null;

  const yoyHtml = yoyRate !== null
    ? `<div class="sub">YoY: <span class="${yoyRate >= 0 ? 'yoy-up' : 'yoy-down'}">${yoyRate >= 0 ? '+' : ''}${pct(yoyRate)}</span> (전년 ${fmt(prevTotal)})</div>`
    : '';

  document.getElementById('kpiRow').innerHTML = `
    <div class="kpi-card">
      <div class="label">기간 목표</div>
      <div class="value">${fmt(planTotal)}</div>
      <div class="sub">연간 목표: ${fmt(yearPlan)}</div>
    </div>
    <div class="kpi-card">
      <div class="label">실적</div>
      <div class="value">${fmt(actualTotal)}</div>
      <div class="sub">목표 대비 차이: ${gap >= 0 ? '+' : ''}${fmt(gap)}</div>
      ${yoyHtml}
    </div>
    <div class="kpi-card">
      <div class="label">기간 달성률</div>
      <div class="value rate ${rateClass(rate)}">${pct(rate)}</div>
      <div class="sub">연간 진척률: ${pct(yearRate)}</div>
    </div>
    <div class="kpi-card">
      <div class="label">채널 수</div>
      <div class="value">${plan.length}개</div>
      <div class="sub">온라인 ${plan.filter(d=>d.type==='온라인').length} / 오프라인 ${plan.filter(d=>d.type==='오프라인').length} / 해외 ${plan.filter(d=>d.type==='해외').length}</div>
    </div>
  `;
}

  chartType = new Chart(document.getElementById('chartType'), {
    type: 'bar',
    data: {
      labels: types,
      datasets: [
        { label:'목표', data:types.map(t=>typePlan[t]), backgroundColor:'rgba(165,214,167,.5)', borderColor:'#81c784', borderWidth:1 },
        { label:'실적', data:types.map(t=>typeAct[t]), backgroundColor:'rgba(46,125,50,.7)', borderColor:'#2e7d32', borderWidth:1 }
      ]
    },
    options: {
      responsive:true, plugins:{legend:{position:'top',labels:{font:{size:12}}}},
      scales:{y:{ticks:{callback:v=>fmt(v)},grid:{color:'#f1f5f9'}},x:{grid:{display:false}}}
    }
  });

  // 3. Manager chart
  const managers = [...new Set(plan.map(d=>d.manager))];
  const mgrPlan = {}, mgrAct = {};
  managers.forEach(m => { mgrPlan[m]=0; mgrAct[m]=0; });
  plan.forEach(p => {
    mgrPlan[p.manager] += getPlanForPeriod(p, month);
    const a = findActual(p);
    if (a) mgrAct[p.manager] += getActualForPeriod(a, month);
  });

  if (chartManager) chartManager.destroy();
  chartManager = new Chart(document.getElementById('chartManager'), {
    type: 'bar',
    data: {
      labels: managers,
      datasets: [
        { label:'목표', data:managers.map(m=>mgrPlan[m]), backgroundColor:'rgba(165,214,167,.5)', borderColor:'#81c784', borderWidth:1 },
        { label:'실적', data:managers.map(m=>mgrAct[m]), backgroundColor:'rgba(46,125,50,.7)', borderColor:'#2e7d32', borderWidth:1 }
      ]
    },
    options: {
      indexAxis:'y', responsive:true, plugins:{legend:{position:'top',labels:{font:{size:12}}}},
      scales:{x:{ticks:{callback:v=>fmt(v)},grid:{color:'#f1f5f9'}},y:{grid:{display:false}}}
    }
  });

  // 4. Group achievement
  const groups = [...new Set(plan.map(d=>d.group))];
  const grpRates = [];
  const grpLabels = [];
  groups.forEach(g => {
    let gp = 0, ga = 0;
    plan.filter(d=>d.group===g).forEach(p => {
      gp += getPlanForPeriod(p, month);
      const a = findActual(p);
      if (a) ga += getActualForPeriod(a, month);
    });
    if (gp > 0) {
      grpLabels.push(g);
      grpRates.push(Math.round(ga/gp*1000)/10);
    }
  });

  const barColors = grpRates.map(r => r >= 100 ? '#1b5e20' : r >= 90 ? '#4caf50' : r >= 70 ? '#f59e0b' : '#dc2626');

  if (chartGroup) chartGroup.destroy();
  chartGroup = new Chart(document.getElementById('chartGroup'), {
    type: 'bar',
    data: {
      labels: grpLabels,
      datasets: [{
        data: grpRates, backgroundColor: barColors, borderRadius: 4
      }]
    },
    options: {
      indexAxis:'y', responsive:true, plugins:{legend:{display:false},
        tooltip:{callbacks:{label:ctx=>ctx.raw+'%'}}
      },
      scales:{x:{max:Math.max(150, ...grpRates)+10, ticks:{callback:v=>v+'%'},grid:{color:'#f1f5f9'}},y:{grid:{display:false}}}
    }
  });
}

function yoyCell(actualVal, prevVal) {
  if (prevVal === null || prevVal === undefined) return '<td class="yoy-na">-</td>';
  if (prevVal === 0 && actualVal === 0) return '<td class="yoy-na">-</td>';
  if (prevVal === 0) return '<td class="yoy-up">NEW</td>';
  const yoy = actualVal / prevVal - 1;
  const cls = yoy >= 0 ? 'yoy-up' : 'yoy-down';
  return `<td class="${cls}">${yoy >= 0 ? '+' : ''}${pct(yoy)}</td>`;
}

function renderTable() {
  const { plan, actual, month } = getFiltered();

  let rows = plan.map(p => {
    const a = findActual(p);
    const pv = getPlanForPeriod(p, month);
    const av = a ? getActualForPeriod(a, month) : 0;
    const rate = pv > 0 ? av / pv : 0;
    const yearPlan = p.total;
    const yearActual = a ? a.total : 0;
    const yearRate = yearPlan > 0 ? yearActual / yearPlan : 0;
    const prevMonths = getPrevMonths(p);
    const prevVal = getPrevForPeriod(prevMonths, month);
    return { ...p, planVal: pv, actualVal: av, rate, yearPlan, yearActual, yearRate, prevVal };
  });

  const typeBadge = t => t==='온라인'?'badge-online':t==='오프라인'?'badge-offline':'badge-export';

  let html = `<table>
    <thead><tr>
      <th>유형</th><th>구분</th><th>채널</th><th>담당자</th>
      <th>기간 목표</th><th>기간 실적</th><th>달성률</th><th>진척 현황</th>
      <th>전년 실적</th><th>YoY</th>
      <th>연간 목표</th><th>연간 실적</th><th>연간 진척률</th>
    </tr></thead><tbody>`;

  rows.sort((a, b) => b.rate - a.rate);

  rows.forEach(r => {
    const barW = Math.min(r.rate * 100, 100);
    html += `<tr>
      <td><span class="badge ${typeBadge(r.type)}">${r.type}</span></td>
      <td>${r.group}</td><td><b>${r.channel}</b></td><td>${r.manager}</td>
      <td>${fmtFull(r.planVal)}</td><td>${fmtFull(r.actualVal)}</td>
      <td class="rate ${rateClass(r.rate)}"><b>${pct(r.rate)}</b></td>
      <td class="progress-cell">
        <div class="progress-bar-bg">
          <div class="progress-bar-fill ${fillClass(r.rate)}" style="width:${barW}%">
            <span>${pct(r.rate)}</span>
          </div>
        </div>
      </td>
      <td>${r.prevVal !== null ? fmtFull(r.prevVal) : '<span class="yoy-na">-</span>'}</td>
      ${yoyCell(r.actualVal, r.prevVal)}
      <td>${fmtFull(r.yearPlan)}</td><td>${fmtFull(r.yearActual)}</td>
      <td class="rate ${rateClass(r.yearRate)}"><b>${pct(r.yearRate)}</b></td>
    </tr>`;
  });

  html += '</tbody></table>';
  document.getElementById('tableAll').innerHTML = html;

  // Manager grouped table
  const managers = [...new Set(plan.map(d=>d.manager))];
  let mgrHtml = '';
  managers.forEach(mgr => {
    const mgrRows = rows.filter(r => r.manager === mgr);
    const mgrPlanTotal = mgrRows.reduce((s, r) => s + r.planVal, 0);
    const mgrActualTotal = mgrRows.reduce((s, r) => s + r.actualVal, 0);
    const mgrRate = mgrPlanTotal > 0 ? mgrActualTotal / mgrPlanTotal : 0;
    const mgrPrevTotal = mgrRows.reduce((s, r) => s + (r.prevVal || 0), 0);
    const mgrYoy = mgrPrevTotal > 0 ? (mgrActualTotal / mgrPrevTotal - 1) : null;
    const mgrYoyHtml = mgrYoy !== null ? ` | YoY: <span class="${mgrYoy >= 0 ? 'yoy-up' : 'yoy-down'}">${mgrYoy >= 0 ? '+' : ''}${pct(mgrYoy)}</span>` : '';

    mgrHtml += `<div class="manager-section">
      <div class="manager-header">
        <span>${mgr} (${mgrRows.length}개 채널)</span>
        <span>목표: ${fmt(mgrPlanTotal)} | 실적: ${fmt(mgrActualTotal)} | 달성률: <span class="rate ${rateClass(mgrRate)}">${pct(mgrRate)}</span>${mgrYoyHtml}</span>
      </div>
      <table><thead><tr>
        <th>구분</th><th>채널</th><th>기간 목표</th><th>기간 실적</th><th>달성률</th><th>진척 현황</th><th>전년</th><th>YoY</th>
      </tr></thead><tbody>`;

    mgrRows.forEach(r => {
      const barW = Math.min(r.rate * 100, 100);
      mgrHtml += `<tr>
        <td>${r.group}</td><td><b>${r.channel}</b></td>
        <td>${fmtFull(r.planVal)}</td><td>${fmtFull(r.actualVal)}</td>
        <td class="rate ${rateClass(r.rate)}"><b>${pct(r.rate)}</b></td>
        <td class="progress-cell">
          <div class="progress-bar-bg">
            <div class="progress-bar-fill ${fillClass(r.rate)}" style="width:${barW}%">
              <span>${pct(r.rate)}</span>
            </div>
          </div>
        </td>
        <td>${r.prevVal !== null ? fmtFull(r.prevVal) : '<span class="yoy-na">-</span>'}</td>
        ${yoyCell(r.actualVal, r.prevVal)}
      </tr>`;
    });
    mgrHtml += '</tbody></table></div>';
  });
  document.getElementById('tableManager').innerHTML = mgrHtml;
}

// Tab switching
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.getElementById('tableAll').style.display = tab === 'all' ? '' : 'none';
    document.getElementById('tableManager').style.display = tab === 'manager' ? '' : 'none';
  });
});

// Init managers dropdown
const allManagers = [...new Set([...PLAN.map(d=>d.manager), ...ACTUAL.map(d=>d.manager)])].filter(m => m && m !== '공통(배정)');
allManagers.sort();
const mgrSelect = document.getElementById('filterManager');
allManagers.forEach(m => { const o = document.createElement('option'); o.value = m; o.textContent = m; mgrSelect.appendChild(o); });
{const o = document.createElement('option'); o.value='공통(배정)'; o.textContent='공통(배정)'; mgrSelect.appendChild(o);}

// Filter change handlers
['filterManager','filterType','filterMonth'].forEach(id => {
  document.getElementById(id).addEventListener('change', () => { renderKPI(); renderCharts(); renderTable(); });
});

// Initial render
renderKPI();
renderCharts();
renderTable();
</script>
</body>
</html>
